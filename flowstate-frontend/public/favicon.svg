<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Sleek Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base / Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring / AI Orbit Accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="12 8" />

  <!-- Central Graphic Group -->
  <g transform="translate(0, 10)">
    <!-- Graduation Cap (Knowledge/Study) -->
    <path d="M256 130 L400 195 L256 260 L112 195 Z" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />

    <path d="M256 130 L400 195 L256 260 L112 195 Z" fill="#1E1B4B" fill-opacity="0.6" />

    <!-- Cap Band -->
    <path d="M168 234.5 V300 C168 335 205 365 256 365 C307 365 344 335 344 300 V234.5" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Tassel / AI Sparkle Node -->
    <path d="M340 213 V305 C340 325 320 340 300 340" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-dasharray="6 6" />

    <circle cx="300" cy="340" r="8" fill="#38BDF8" filter="url(#glow)" />

    <!-- AI Core Node / Sparkle Center -->
    <g transform="translate(256, 230)">
      <path d="M0 -30 L7 -7 L30 0 L7 7 L0 30 L-7 7 L-30 0 L-7 -7 Z" fill="url(#accentGrad)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Neural Connecting Nodes (Planning/AI Matrix) -->
    <circle cx="180" cy="180" r="6" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="332" cy="180" r="6" fill="#C084FC" filter="url(#glow)" />
    <line x1="180" y1="180" x2="230" y2="210" stroke="#818CF8" stroke-width="3" stroke-opacity="0.6" />
    <line x1="332" y1="180" x2="282" y2="210" stroke="#818CF8" stroke-width="3" stroke-opacity="0.6" />
  </g>
</svg>
